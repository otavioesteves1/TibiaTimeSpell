<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' file: data:">
<link rel="stylesheet" href="config.css">
</head>
<body>

<header class="topbar">
  <div class="title">
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="8.5"/><path d="M12 7v5.3l3.4 2"/>
      </svg>
    </div>
    <h1>TibiaTimeSpell</h1>
    <span id="saved" class="saved">Salvo</span>
  </div>
  <div class="wctl">
    <button id="win-min" class="wbtn" title="Minimizar" aria-label="Minimizar">
      <svg viewBox="0 0 12 12"><path d="M2 6h8" stroke="currentColor" stroke-width="1.2"/></svg>
    </button>
    <button id="win-max" class="wbtn" title="Maximizar" aria-label="Maximizar">
      <svg viewBox="0 0 12 12"><rect x="2.5" y="2.5" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
    </button>
    <button id="win-close" class="wbtn close" title="Fechar" aria-label="Fechar">
      <svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.2"/></svg>
    </button>
  </div>
</header>

<main>

  <div class="sec-head">
    <span class="sec-title">Magias <span id="count" class="count">0</span></span>
    <div class="sec-actions">
      <button id="btn-restart-all" class="ghost-btn" title="Reiniciar todos os timers">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v5h-5"/></svg>
      </button>
      <button id="btn-add" class="add-btn" title="Adicionar magia">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Nova
      </button>
    </div>
  </div>

  <div id="rows" class="list"></div>
  <div id="empty" class="empty" hidden>Nenhuma magia ainda. Clique em <b>Nova</b> para começar.</div>

  <section class="panel">
    <button id="ov-head" class="panel-head" aria-expanded="false">
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      <span>Overlay e som</span>
    </button>
    <div id="ov-body" class="panel-body" hidden>
      <label class="field">
        <span>Tamanho</span>
        <select id="size">
          <option value="icon">Ícone</option>
          <option value="mini">Mini</option>
          <option value="small">Pequeno</option>
          <option value="medium">Médio</option>
          <option value="large">Grande</option>
        </select>
      </label>

      <label class="field">
        <span>Organização</span>
        <select id="layout">
          <option value="vertical">Um embaixo do outro</option>
          <option value="horizontal">Lado a lado</option>
          <option value="free">Livre</option>
        </select>
      </label>

      <label class="field">
        <span>Posição</span>
        <select id="corner">
          <option value="top-right">Superior direito</option>
          <option value="top-left">Superior esquerdo</option>
          <option value="bottom-right">Inferior direito</option>
          <option value="bottom-left">Inferior esquerdo</option>
          <option value="custom">Personalizada</option>
        </select>
      </label>

      <button id="btn-position" class="wide-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M2 12h20M9 5l3-3 3 3M9 19l3 3 3-3M5 9l-3 3 3 3M19 9l3 3-3 3"/></svg>
        <span id="pos-label">Arrastar overlay</span>
      </button>

      <div class="sl" id="sl-icon">
        <div class="sl-label"><span>Tamanho do ícone</span><span id="icon-size-val" class="val">48px</span></div>
        <input type="range" id="icon-size" min="12" max="96" step="4" value="48">
      </div>

      <div class="sl">
        <div class="sl-label"><span>Opacidade</span><span id="opacity-val" class="val">100%</span></div>
        <input type="range" id="opacity" min="20" max="100" step="5" value="100">
      </div>

      <div class="sl">
        <div class="sl-label">
          <span>Volume</span>
          <button id="btn-test" class="mini-btn">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3z"/><path d="M16.5 8.2a5.4 5.4 0 010 7.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            Testar
          </button>
          <span id="volume-val" class="val">60%</span>
        </div>
        <input type="range" id="volume" min="0" max="100" step="5" value="60">
      </div>
    </div>
  </section>

</main>

<!-- linha compacta da lista -->
<template id="row-template">
  <div class="item">
    <div class="row">
      <label class="switch">
        <input type="checkbox" class="in-enabled">
        <span class="tk"></span>
      </label>
      <span class="thumb-mini">
        <img class="thumb-img" hidden alt="">
        <span class="thumb-ph">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 8v4.3l3 1.7"/></svg>
        </span>
      </span>
      <button class="open">
        <span class="r-name">Magia</span>
        <span class="r-key">F1</span>
      </button>
      <span class="st idle r-status">—</span>
      <button class="chev-btn" title="Editar">
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </div>

    <div class="edit" hidden>
      <label class="field">
        <span>Nome</span>
        <input class="in in-name" maxlength="40" placeholder="Nome da magia">
      </label>
      <div class="edit-grid">
        <label class="field">
          <span>Tecla</span>
          <input class="key in-key" maxlength="12" placeholder="F1">
        </label>
        <label class="field">
          <span>Tempo (s)</span>
          <input class="in num in-cd" type="number" min="2" max="3600" step="1">
        </label>
        <label class="field">
          <span>Cor</span>
          <input type="color" class="in-color">
        </label>
      </div>
      <div class="field">
        <span>Imagem</span>
        <div class="img-row">
          <button class="thumb img-btn" title="Imagem da magia">
            <img class="img-thumb" hidden alt="">
            <span class="img-ph">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 6v12M6 12h12"/></svg>
            </span>
          </button>
          <button class="chip act-pick">Escolher</button>
          <button class="chip act-paste">Colar</button>
          <button class="chip act-clear">Remover</button>
        </div>
      </div>
      <div class="edit-foot">
        <button class="chip btn-restart">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v5h-5"/></svg>
          Reiniciar agora
        </button>
        <button class="chip danger btn-del">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg>
          Remover
        </button>
      </div>
    </div>
  </div>
</template>

<div id="img-menu" hidden></div>

<script src="config.js"></script>
</body>
</html>
